# ─────────────────────────────────────────────────────────────
#  Storage Wars · settings
#  Edit these in GitHub (pencil icon) and commit. The next
#  morning's issue follows them. Nothing else needs changing.
# ─────────────────────────────────────────────────────────────

# Format: every issue = 2 big deep-dive stories on the latest news,
# each fully explained (context, how it works, definitions), plus a
# short "On the radar" list of other news (one line each).

# Length: there is NO cap. Each story is as long as it needs to be to
# explain the news completely. Leave this as null. Set a number
# (minutes) only if you ever want the writer to aim for a target.
read_time_minutes: null

# How much background to assume, 1–5:
#   1 = Explain everything from scratch, assume little background
#   2 = Explain most concepts, light internals
#   3 = Working developer: explain new concepts fully, skip basics  (default)
#   4 = Senior: go deep into internals, benchmarks, design trade-offs
#   5 = Expert: spec/source-level detail, edge cases
difficulty: 3

# How many deep-dive stories per issue.
deep_dives: 2

# Optional: areas to prefer when choosing the deep dives, e.g. [kafka, postgres]
# Leave empty [] to simply pick the most important news.
focus: []

# ── Branding (no need to touch) ──────────────────────────────
name: "Storage Wars"
kicker: "Daily data deep dives · the latest news, fully explained"
words_per_minute: 200
email_accent: "#0e7490"
theme:
  accent: "#0e7490"
  accent2: "#7c3aed"
  gradient: ["#06121f", "#0b2a42", "#0e7490", "#22d3ee"]
